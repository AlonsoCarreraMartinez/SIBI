version: '3.8'

services:
  
  neo4j:
    image: neo4j:5.20
    container_name: motorbot_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: motorbot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  app:
    build: .
    container_name: motorbot_app
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123
      - NEO4J_DATABASE=neo4j
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - .:/app
    depends_on:
      - neo4j
      - ollama

volumes:
  neo4j_data:
  ollama_storage: